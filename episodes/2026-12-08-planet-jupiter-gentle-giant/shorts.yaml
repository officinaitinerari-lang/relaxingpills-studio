shorts:
  - title: "How a Moon of Jupiter Revealed the Speed of Light"
    publish_at: "2026-12-09T17:00Z"
    description: "In 1676, Jupiter's moon Io showed that light takes time to travel. #jupiter #space #scienceforsleep"
    localizations: {es: {title: "Cómo una luna de Júpiter reveló la velocidad de la luz"}, pt: {title: "Como uma lua de Júpiter revelou a velocidade da luz"}, fr: {title: "Comment une lune de Jupiter a révélé la vitesse de la lumière"}, de: {title: "Wie ein Jupitermond die Lichtgeschwindigkeit verriet"}, it: {title: "Come una luna di Giove svelò la velocità della luce"}}
    images: ["commons:File:Io highest resolution true color.jpg", "commons:File:Rømer, Ole (ur Berømte danske maend).jpg", "commons:File:Jupiter, Io and Europa - Voyager 1 (29275215195).png"]
    text: |
      A tiny moon of Jupiter told us that light has a speed. The moon is called Io. About every forty-two hours, it slips behind Jupiter and disappears into its shadow. In the sixteen seventies, astronomers in Paris timed these little eclipses very carefully. A young Danish astronomer, Ole Rømer, noticed something strange. When the Earth was moving away from Jupiter, the eclipses came late. When the Earth was moving closer, they came early. In sixteen seventy-six, he predicted that one eclipse would arrive about ten minutes late. It did. His explanation was simple. Light is not instant. It needs time to cross space. And a small moon, going quietly behind a giant planet, was the first to show it. The full calm story is on our channel.
  - title: "Jupiter's Great Red Spot Is Not the One Cassini Saw"
    publish_at: "2026-12-12T17:00Z"
    description: "The famous storm on Jupiter may be younger than we thought. #jupiter #greatredspot #scienceforsleep"
    localizations: {es: {title: "La Gran Mancha Roja no es la que vio Cassini"}, pt: {title: "A Grande Mancha Vermelha não é a que Cassini viu"}, fr: {title: "La Grande Tache rouge n'est pas celle de Cassini"}, de: {title: "Der Große Rote Fleck ist nicht der von Cassini"}, it: {title: "La Grande Macchia Rossa non è quella vista da Cassini"}}
    images: ["commons:File:Great red spot juno 20170712.jpg", "commons:File:Giovanni Domenico Cassini, Biblioteca Aprosiana.jpg", "commons:File:Trouvelot - Jupiter 1880.tif"]
    text: |
      Jupiter's Great Red Spot may not be as old as people thought. It is a giant storm, about as wide as the Earth. In sixteen sixty-five, the astronomer Giovanni Cassini saw a dark oval in the same place, and called it the Permanent Spot. Astronomers followed it until seventeen thirteen. Then, for more than a hundred years, there are no clear records of it. A new oval was recorded in eighteen thirty-one, and we have followed it ever since. In 2024, scientists studied all the old drawings and notes. They concluded that Cassini's spot probably faded away, and that today's storm was born later. Even so, it has been turning for at least a hundred and ninety years. The full calm story is on our channel.
  - title: "This Icy Moon May Hold More Water Than Earth"
    publish_at: "2026-12-13T17:00Z"
    description: "Under the ice of Jupiter's moon Europa there may be a hidden ocean. #europa #jupiter #scienceforsleep"
    localizations: {es: {title: "Esta luna helada podría tener más agua que la Tierra"}, pt: {title: "Esta lua gelada pode ter mais água que a Terra"}, fr: {title: "Cette lune glacée pourrait contenir plus d'eau que la Terre"}, de: {title: "Dieser Eismond könnte mehr Wasser haben als die Erde"}, it: {title: "Questa luna ghiacciata potrebbe avere più acqua della Terra"}}
    images: ["commons:File:PIA19048 realistic color Europa mosaic edited.jpg", "commons:File:Europa Ice Rafts.jpg", "commons:File:Europa Clipper spacecraft best 140912jpg.jpg"]
    text: |
      One of Jupiter's moons may hold more water than all the oceans of the Earth. Its name is Europa. It is a little smaller than our own Moon, and its surface is bright ice, crossed by long reddish lines, like cracks on a frozen lake. There are very few craters, so the surface must be young. Beneath that ice, scientists believe, there is a deep ocean of salty liquid water. The Galileo spacecraft found strong signs of it, in the way Europa reacts to Jupiter's magnetic field. Jupiter's gravity squeezes the moon and keeps it warm inside. That is why NASA's Europa Clipper is now on its way, to look closely at this hidden sea. The full calm story is on our channel.
