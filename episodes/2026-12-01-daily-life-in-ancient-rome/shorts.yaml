shorts:
  - title: "Why Ancient Rome's Carts Only Moved at Night"
    publish_at: "2026-12-02T17:00Z"
    description: "A Roman law kept heavy wagons off the streets by day. #ancientrome #romanhistory #historyforsleep"
    localizations: {es: {title: "Por qué los carros de la antigua Roma solo iban de noche"}, pt: {title: "Por que as carroças da Roma antiga só andavam à noite"}, fr: {title: "Pourquoi les chariots de Rome roulaient la nuit"}, de: {title: "Warum Roms Karren nur nachts fahren durften"}, it: {title: "Perché i carri dell'antica Roma giravano solo di notte"}}
    images: ["search:Roman cart relief sculpture", "commons:File:Pompeii - Via dell'Abbondanza.jpg", "search:Roman countryside landscape painting evening"]
    text: |
      Ancient Rome had a traffic law, and it was very strict. A law from the time of Julius Caesar said that heavy wagons could not drive through the city after sunrise, until about the tenth hour of the day. There were a few exceptions, like carts carrying stone for temples, or carts in religious processions. But grain, wine, firewood and vegetables all had to come in at night. So while Rome slept, Rome worked. Ox carts and donkey carts rolled over the paving stones in the dark. The poet Juvenal complained that the noise could wake a sleeping seal, or even an emperor. Two thousand years ago, people already lay awake listening to city traffic. The full calm story is on our channel.
  - title: "In Ancient Rome, the Top Floor Was the Worst Home"
    publish_at: "2026-12-05T17:00Z"
    description: "Why Romans paid more to live near the street. #ancientrome #history #historyforsleep"
    localizations: {es: {title: "En la antigua Roma, el último piso era el peor"}, pt: {title: "Na Roma antiga, o último andar era o pior"}, fr: {title: "Dans la Rome antique, le dernier étage était le pire"}, de: {title: "Im alten Rom war das oberste Stockwerk das schlechteste"}, it: {title: "Nell'antica Roma l'ultimo piano era il peggiore"}}
    images: ["commons:File:Insula reconstrustion. Casa di Diana. Gismondi.JPG", "commons:File:Ostia antica - Casa di Diana 01.JPG", "commons:File:La maison de Diane (Ostia Antica) (5901008906).jpg"]
    text: |
      Would you pay more for the top floor? In ancient Rome, nobody would. Most Romans lived in tall apartment blocks called insulae, often four or five floors high. On the ground floor there were shops. Just above them were the best homes, with bigger rooms, higher ceilings, and sometimes painted walls. As you climbed the narrow stairs, the rooms became smaller and cheaper. At the very top, under the roof tiles, lived the poorest tenants. Their rooms were hot in summer, cold in winter, and far from the water of the street fountains. Today, the view is what people pay for. In Rome, the view was not worth the stairs. The full calm story is on our channel.
  - title: "A Real Roman Loaf of Bread, Still in Its Oven"
    publish_at: "2026-12-06T17:00Z"
    description: "The bread that survived Vesuvius for almost two thousand years. #ancientrome #pompeii #historyforsleep"
    localizations: {es: {title: "Un pan romano de verdad, todavía en su horno"}, pt: {title: "Um pão romano de verdade, ainda no forno"}, fr: {title: "Un vrai pain romain, encore dans son four"}, de: {title: "Ein echtes römisches Brot, noch im Ofen"}, it: {title: "Un vero pane romano, ancora nel suo forno"}}
    images: ["commons:File:Sale bread MAN Napoli Inv9071 n01.jpg", "commons:File:Tomb of Eurysaces the Baker - details.jpg", "commons:File:Fresco portrait of the baker Terentius Neo and his wife, from Pompeii.jpg"]
    text: |
      Archaeologists once opened a Roman oven and found the bread still inside. It happened in nineteen thirty, in Herculaneum, a town buried by the eruption of Mount Vesuvius in the year seventy-nine. The loaf had turned black and hard, like charcoal, but it kept its shape. It was round, and divided on top into segments, so it could be broken easily and shared. Most Romans in apartments had no oven of their own, so they bought bread every morning from bakeries. Donkeys turned the heavy millstones. Bakers shaped the dough before dawn. Some loaves were even stamped with a mark before baking. Nearly two thousand years later, that one loaf is still here. The full calm story is on our channel.
