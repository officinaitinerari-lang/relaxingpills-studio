title: "What Was Life Really Like in Ancient Rome? | History for Sleep"
description: |
  Fall asleep to ancient Rome for sleep: one calm day from dawn to night — real history, softly told, for sleep, study or relaxation.

  What was life like in ancient Rome? Tonight we follow one ordinary day in the great city of the emperors. We wake in a tall apartment block before sunrise, listen to the night carts on the stones, greet a patron in his quiet atrium and buy warm bread from a Roman bakery. This is daily life in ancient Rome, told slowly, without battles or drama.

  We follow the water of the aqueducts to the street fountains, sit with children learning letters on wax tablets, walk through shops and the Forum, rest in the warm rooms of the Roman baths and recline at an evening dinner. A gentle piece of Roman history to fall asleep to, as the lamps go out and the city sleeps.
