shorts:
  - title: "Why Roman carts only moved at night"
    publish_at: "2026-12-02T15:00"
    images: ["search:Roman cart relief", "search:Roman street Pompeii"]
    text: |
      In ancient Rome, most carts were banned from the streets during the day. Julius Caesar's laws pushed heavy deliveries into the night. So the city that slept was also the city that worked. Romans complained about the noise of wheels on stone until dawn. The full calm story of a Roman day is on our channel.
